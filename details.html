<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Details - Squad Games Store TZ</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* --- DETAILS PORTAL OVERRIDES --- */
        body {
            background-color: #0b0b0e;
            color: #fff;
            font-family: 'Montserrat', sans-serif !important;
            margin: 0;
            padding: 0;
        }

        .gamingtz-header {
            background: linear-gradient(180deg, rgba(15,15,20,0.95) 0%, rgba(10,10,12,0.98) 100%);
            border-bottom: 2px solid rgba(255,149,0,0.3);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .details-container {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Cinematic Hero Layout */
        .game-hero-wrapper {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 35px;
            background: rgba(18, 18, 22, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            margin-bottom: 35px;
        }

        @media (max-width: 900px) {
            .game-hero-wrapper {
                grid-template-columns: 1fr;
            }
        }

        .game-poster-box {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            height: 420px;
            background: #000;
        }

        .game-poster-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-info-content h1 {
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            margin: 0 0 10px 0;
            text-transform: uppercase;
        }

        .meta-badges-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 15px 0 20px 0;
        }

        .meta-badge {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .meta-badge.highlight {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            border-color: rgba(34, 197, 94, 0.3);
        }

        .game-synopsis {
            font-size: 0.92rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .genres-pills-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .genre-pill {
            background: rgba(255, 149, 0, 0.15);
            color: #ff9500;
            border: 1px solid rgba(255, 149, 0, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .action-buttons-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .portal-btn {
            background: linear-gradient(135deg, #e50914, #b20710);
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(229, 9, 20, 0.4);
            transition: transform 0.2s;
        }

        .portal-btn:hover {
            transform: translateY(-2px);
        }

        .portal-btn.secondary {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: none;
        }

        /* Comments Section */
        .comments-section-box {
            background: rgba(18, 18, 22, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 35px;
        }

        .comment-input-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .comment-input-box input, .comment-input-box textarea {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 12px 16px;
            border-radius: 10px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.88rem;
            outline: none;
        }

        .comment-input-box textarea {
            height: 100px;
            resize: vertical;
        }

        .comment-item {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .comment-author {
            font-weight: 700;
            color: #ff9500;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }

        .comment-text {
            color: #cbd5e1;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        /* Recommended Similar Games Section */
        .recommended-section {
            margin-top: 40px;
        }

        .recommended-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Top Header -->
    <header class="gamingtz-header">
        <a href="index.html" style="text-decoration: none; display: flex; align-items: center; gap: 10px;">
            <div style="font-family: 'Permanent Marker', cursive; font-size: 1.8rem; color: #fff;">SquAd<span style="color: #ff9500;">GameZ</span></div>
            <span style="background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; font-size: 0.6rem; color: #cbd5e1;">STORE</span>
        </a>
        <a href="index.html" class="portal-btn secondary" style="padding: 8px 16px; font-size: 0.8rem;"><i class="fa-solid fa-arrow-left"></i> Back to Store</a>
    </header>

    <div class="details-container">
        <!-- Game Hero Overview Box -->
        <div class="game-hero-wrapper" id="gameHeroContainer">
            <div class="loading-state" style="grid-column: 1 / -1; text-align: center; padding: 40px;">
                <div class="spinner"></div>
                <p style="color: #94a3b8;">Loading game details...</p>
            </div>
        </div>

        <!-- Similar / Recommended Games Section (Dynamically generated) -->
        <div class="recommended-section" id="recommendedSection" style="display: none;">
            <h3 class="section-title"><i class="fa-solid fa-fire" style="color: #ff9500;"></i> Recommended & Similar Games</h3>
            <div class="recommended-grid" id="recommendedGrid"></div>
        </div>

        <!-- Interactive Comments & Reviews Section -->
        <div class="comments-section-box">
            <h3 class="section-title" style="margin-bottom: 20px;"><i class="fa-solid fa-comments" style="color: #38bdf8;"></i> Player Reviews & Comments</h3>
            
            <div class="comment-input-box">
                <input type="text" id="commentAuthorInput" placeholder="Jina lako (Your Name)...">
                <textarea id="commentTextInput" placeholder="Andika maoni yako hapa (Write your review/comment)..."></textarea>
                <button class="portal-btn" style="align-self: flex-start; padding: 10px 22px;" onclick="postComment()"><i class="fa-solid fa-paper-plane"></i> Tuma Maoni</button>
            </div>

            <div id="commentsListContainer">
                <!-- Dynamically loaded comments -->
            </div>
        </div>
    </div>

    <script>
        let currentGameData = null;
        let allGamesCatalog = [];

        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const gameId = urlParams.get('id');

            if (!gameId) {
                window.location.href = 'index.html';
                return;
            }

            try {
                const response = await fetch('./games.json');
                const data = await response.json();
                allGamesCatalog = Array.isArray(data) ? data : (data.games || data.data || []);

                currentGameData = allGamesCatalog.find(g => String(g.id || g.title) === decodeURIComponent(gameId));

                if (currentGameData) {
                    renderGameDetails(currentGameData);
                    renderRecommendedGames(currentGameData, allGamesCatalog);
                    loadSavedComments(gameId);
                } else {
                    document.getElementById('gameHeroContainer').innerHTML = `<p style="text-align:center; color:#e50914;">Game not found.</p>`;
                }
            } catch (err) {
                console.error("Error loading game details:", err);
            }
        });

        function renderGameDetails(game) {
            const container = document.getElementById('gameHeroContainer');
            const isPaid = game.price && game.price.toUpperCase() !== "FREE" && game.price.trim() !== "";
            
            let actionBtnHTML = '';
            let gameParts = game.parts || game.downloadParts;

            if (isPaid) {
                actionBtnHTML = `<button class="portal-btn" onclick="showPaymentOptionsModal(${JSON.stringify(game).replace(/"/g, '&quot;')})"><i class="fa-solid fa-cart-shopping"></i> Buy Now (${game.price})</button>`;
            } else if (gameParts && gameParts.length > 0) {
                actionBtnHTML = `<a href="download.html?id=${encodeURIComponent(game.id || game.title)}" class="portal-btn"><i class="fa-solid fa-download"></i> Download Parts</a>`;
            } else {
                actionBtnHTML = `<a href="${game.downloadUrl || '#'}" target="_blank" class="portal-btn"><i class="fa-solid fa-download"></i> Instant Download</a>`;
            }

            // Extract genres pills
            let genresList = game.category ? game.category.split(/[\/,|]+/) : ['Action', 'PC Game'];
            let genresHTML = genresList.map(g => `<span class="genre-pill">${g.trim()}</span>`).join('');

            container.innerHTML = `
                <div class="game-poster-box">
                    <img src="${game.image || 'images/nfsmw-shot1.png'}" alt="${game.title}" onerror="this.src='images/nfsmw-shot1.png';">
                </div>
                <div class="game-info-content">
                    <span class="category-tag">${game.platform || "PC Game"}</span>
                    <h1>${game.title}</h1>

                    <div class="meta-badges-row">
                        <span class="meta-badge highlight"><i class="fa-solid fa-shield-halved"></i> 100% Verified</span>
                        <span class="meta-badge"><i class="fa-solid fa-hard-drive"></i> Size: ${game.size || 'Standard'}</span>
                        <span class="meta-badge"><i class="fa-solid fa-calendar"></i> Released: 2026</span>
                        <span class="meta-badge"><i class="fa-solid fa-tag"></i> ${game.price || 'FREE'}</span>
                    </div>

                    <div class="genres-pills-row">
                        ${genresHTML}
                    </div>

                    <p class="game-synopsis">${game.description || 'No description provided for this title yet. Fully tested and verified for Tanzania gamers.'}</p>

                    <div class="action-buttons-row">
                        ${actionBtnHTML}
                        <a href="https://wa.me/255692752060?text=${encodeURIComponent('Hello SquadGames, I need help with ' + game.title)}" target="_blank" class="portal-btn secondary">
                            <i class="fa-brands fa-whatsapp" style="color: #25d366; font-size: 1.1rem;"></i> Need Help?
                        </a>
                    </div>
                </div>
            `;
        }

        // Automatically scans and recommends similar games based on category matching
        function renderRecommendedGames(currentGame, allGames) {
            const currentCat = (currentGame.category || "").toLowerCase();
            const similar = allGames.filter(g => {
                if (String(g.id) === String(currentGame.id)) return false;
                const gCat = (g.category || "").toLowerCase();
                return gCat.includes(currentCat) || currentCat.includes(gCat);
            }).slice(0, 4);

            if (similar.length > 0) {
                document.getElementById('recommendedSection').style.display = 'block';
                const grid = document.getElementById('recommendedGrid');
                grid.innerHTML = similar.map(game => `
                    <div class="game-card" onclick="window.location.href='details.html?id=${encodeURIComponent(game.id || game.title)}'" style="cursor: pointer;">
                        <div class="game-img-wrapper" style="height: 140px;">
                            <img src="${game.image || 'images/nfsmw-shot1.png'}" alt="${game.title}" class="game-img">
                        </div>
                        <div class="game-details" style="padding: 12px;">
                            <h3 style="font-size: 0.85rem !important; margin-bottom: 4px;">${game.title}</h3>
                            <span class="price" style="font-size: 0.8rem !important;">${game.price || 'FREE'}</span>
                        </div>
                    </div>
                `).join('');
            }
        }

        // Comment section handling
        function loadSavedComments(gameId) {
            const container = document.getElementById('commentsListContainer');
            const saved = JSON.parse(localStorage.getItem('comments_' + gameId) || '[]');
            
            if (saved.length === 0) {
                container.innerHTML = `<p style="color: #64748b; font-size: 0.85rem; font-style: italic;">Hakuna maoni bado. Kuwa wa kwanza kuweka maoni yako!</p>`;
                return;
            }

            container.innerHTML = saved.map(c => `
                <div class="comment-item">
                    <div class="comment-author"><i class="fa-solid fa-user-circle"></i> ${escapeHtml(c.author)}</div>
                    <div class="comment-text">${escapeHtml(c.text)}</div>
                </div>
            `).join('');
        }

        function postComment() {
            const authorInput = document.getElementById('commentAuthorInput');
            const textInput = document.getElementById('commentTextInput');
            const gameId = new URLSearchParams(window.location.search).get('id');

            const author = authorInput.value.trim() || "Mchezaji Anonymous";
            const text = textInput.value.trim();

            if (!text) {
                alert("Tafadhali andika maoni kabla ya kutuma.");
                return;
            }

            const key = 'comments_' + gameId;
            const saved = JSON.parse(localStorage.getItem(key) || '[]');
            saved.unshift({ author, text });
            localStorage.setItem(key, JSON.stringify(saved));

            authorInput.value = '';
            textInput.value = '';
            loadSavedComments(gameId);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
