<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Details - Squad Games Store TZ</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg-main: #0b0b0e;
            --bg-card: #141419;
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-blue: #007aff;
            --accent-green: #22c55e;
            --accent-red: #e50914;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1140px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        /* Top Header Navigation */
        .details-header {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 18px 24px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .store-logo {
            font-size: 1.25rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 30%, var(--accent-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            text-decoration: none;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px 16px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Main Hero Card (ApunKaGames Style) */
        .game-hero-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.6);
            margin-bottom: 30px;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 35px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .hero-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Cover Image & Quick Specs */
        .cover-wrapper {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            background: #000;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }

        .cover-wrapper img {
            width: 100%;
            height: 460px;
            object-fit: cover;
            display: block;
            cursor: pointer;
            transition: transform 0.4s ease;
        }

        .cover-wrapper img:hover {
            transform: scale(1.03);
        }

        .specs-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            margin-top: 20px;
        }

        .spec-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.88rem;
        }

        .spec-row:last-child {
            border-bottom: none;
        }

        .spec-label {
            color: var(--text-muted);
            font-weight: 600;
        }

        .spec-value {
            color: #fff;
            font-weight: 700;
            text-align: right;
        }

        /* Game Info Content */
        .game-info-content h1 {
            margin: 0 0 12px 0;
            font-size: 2.1rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .badge-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .badge {
            background: rgba(0, 122, 255, 0.15);
            color: var(--accent-blue);
            border: 1px solid rgba(0, 122, 255, 0.3);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-price {
            background: rgba(34, 197, 94, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .game-description {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.7;
            margin-bottom: 25px;
            white-space: pre-line;
        }

        /* System Requirements Box */
        .sys-req-container {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .sys-req-container h3 {
            margin: 0 0 12px 0;
            font-size: 1.05rem;
            color: #ff9500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sys-req-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .sys-req-grid strong {
            color: #fff;
        }

        /* Download / Action Box */
        .download-box {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.1), rgba(16, 185, 129, 0.05));
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 14px;
            padding: 22px;
            text-align: center;
        }

        .download-btn-main {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            text-decoration: none;
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            border: none;
            box-sizing: border-box;
        }

        .download-btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(34, 197, 94, 0.6);
        }

        /* Screenshots Gallery */
        .screenshots-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.6);
        }

        .screenshots-section h3 {
            margin: 0 0 18px 0;
            font-size: 1.2rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .screenshots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 14px;
        }

        .screenshot-item {
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background: #000;
            height: 130px;
            cursor: pointer;
        }

        .screenshot-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
            display: block;
        }

        .screenshot-item img:hover {
            transform: scale(1.08);
        }

        /* Installation Guide Box */
        .install-guide-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-blue);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .install-guide-box h3 {
            margin: 0 0 14px 0;
            font-size: 1.1rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .install-guide-box ol {
            margin: 0;
            padding-left: 20px;
            color: var(--text-muted);
            line-height: 1.8;
            font-size: 0.9rem;
        }

        .install-guide-box li strong {
            color: #fff;
        }

        /* Lightbox Modal */
        .lightbox-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            opacity: 0;
            transition: opacity 0.3s ease;
            padding: 20px;
            box-sizing: border-box;
        }

        .lightbox-overlay.active {
            opacity: 1;
        }

        .lightbox-img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 12px;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            object-fit: contain;
        }

        .lightbox-close {
            position: absolute;
            top: 25px;
            right: 35px;
            font-size: 2.5rem;
            color: #fff;
            cursor: pointer;
            opacity: 0.8;
        }

        .lightbox-close:hover {
            opacity: 1;
        }

        .loading-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Header Navigation -->
        <div class="details-header">
            <a href="index.html" class="store-logo">Squad Games Store TZ</a>
            <a href="index.html" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i> Back to Store
            </a>
        </div>

        <!-- Main Game Details Container -->
        <div id="game-details-container">
            <div class="loading-state">
                <i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem; color: var(--accent-blue); margin-bottom: 12px;"></i>
                <p>Loading game details...</p>
            </div>
        </div>
    </div>

    <!-- Lightbox Modal Overlay -->
    <div id="lightboxModal" class="lightbox-overlay" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>
        <img id="lightboxImg" class="lightbox-img" src="" alt="Zoomed Screenshot">
    </div>

    <!-- Script Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const gameId = urlParams.get('id') || urlParams.get('game');
            const container = document.getElementById('game-details-container');

            if (!gameId) {
                container.innerHTML = `
                    <div class="game-hero-card" style="text-align: center; padding: 50px;">
                        <i class="fa-solid fa-triangle-exclamation" style="font-size: 3rem; color: #ffc107; margin-bottom: 15px;"></i>
                        <h2>No Game Selected</h2>
                        <p style="color: var(--text-muted); margin-bottom: 20px;">Please select a game from the home store[cite: 11].</p>
                        <a href="index.html" class="back-btn" style="background: var(--accent-blue); display: inline-flex;">Return Home</a>
                    </div>
                `;
                return;
            }

            fetch('games.json')
                .then(res => {
                    if (!res.ok) throw new Error("Failed to load games.json");
                    return res.json();
                })
                .then(rawData => {
                    let gamesArray = Array.isArray(rawData) ? rawData : (rawData.games || rawData.data || rawData.list || Object.values(rawData).find(Array.isArray) || []);

                    const game = gamesArray.find(g => 
                        String(g.id) === String(gameId) || 
                        String(g.title).toLowerCase() === String(gameId).toLowerCase()
                    );

                    if (!game) {
                        container.innerHTML = `
                            <div class="game-hero-card" style="text-align: center; padding: 50px;">
                                <i class="fa-solid fa-circle-xmark" style="font-size: 3rem; color: var(--accent-red); margin-bottom: 15px;"></i>
                                <h2>Game Not Found</h2>
                                <p style="color: var(--text-muted); margin-bottom: 20px;">The requested game does not exist in the catalog[cite: 11].</p>
                                <a href="index.html" class="back-btn" style="background: var(--accent-blue); display: inline-flex;">Return Home</a>
                            </div>
                        `;
                        return;
                    }

                    renderGameDetails(game);
                })
                .catch(err => {
                    console.error("Error:", err);
                    container.innerHTML = `
                        <div class="game-hero-card" style="text-align: center; padding: 50px; color: var(--accent-red);">
                            <i class="fa-solid fa-triangle-exclamation" style="font-size: 3rem; margin-bottom: 15px;"></i>
                            <h2>Catalog Error</h2>
                            <p style="color: var(--text-muted);">Could not load games catalog data[cite: 11].</p>
                        </div>
                    `;
                });
        });

        function renderGameDetails(game) {
            const container = document.getElementById('game-details-container');
            const title = game.title || "Untitled Game";
            const category = game.category || game.Category || "Action / PC";
            const platform = game.platform || "PC / Windows";
            const image = game.image || "images/nfsmw-shot1.png";
            const description = game.description || "High-speed action packed game release with verified direct download links.";
            const gameSize = game.size || "N/A";
            const screenshots = game.screenshots || [];
            
            const isPaid = String(game.id) === "1" || String(game.id) === "2";
            const displayPrice = String(game.id) === "1" ? "TZS 20,000" : String(game.id) === "2" ? "TZS 10,000" : "FREE";

            // System requirements formatting
            let sysReqHTML = `<p style="margin: 0; color: var(--text-muted);">Standard PC hardware requirements apply.</p>`;
            if (game.systemRequirements && typeof game.systemRequirements === 'object') {
                const req = game.systemRequirements;
                sysReqHTML = `
                    <div class="sys-req-grid">
                        <div><strong>OS:</strong> ${req.os || 'Windows 10 / 11 (64-bit)'}</div>
                        <div><strong>Processor:</strong> ${req.processor || 'Intel Core i5 / AMD equivalent'}</div>
                        <div><strong>Memory (RAM):</strong> ${req.ram || '8 GB RAM'}</div>
                        <div><strong>Storage:</strong> ${req.storage || gameSize} available space</div>
                    </div>
                `;
            }

            // Action / Download button rendering
            let actionButtonHTML = '';
            let gameParts = game.parts || game.downloadParts;

            if (isPaid) {
                const orderMessage = encodeURIComponent(`Hello SquadGames, I want to buy ${title} (${platform}) using Vodacom mobile money.`);
                const buyUrl = `https://wa.me/255692752060?text=${orderMessage}`;
                actionButtonHTML = `
                    <div class="download-box">
                        <p style="margin: 0 0 12px 0; font-size: 0.9rem; color: #fff; font-weight: 600;">💎 Premium Game Release — Price: <span style="color: var(--accent-green);">${displayPrice}</span></p>
                        <a href="${buyUrl}" target="_blank" class="download-btn-main" style="background: linear-gradient(135deg, #25d366, #128c7e); box-shadow: 0 8px 25px rgba(37,211,102,0.4);">
                            <i class="fa-brands fa-whatsapp" style="font-size: 1.3rem;"></i> Buy Now via WhatsApp (${displayPrice})
                        </a>
                    </div>
                `;
            } else if (gameParts && gameParts.length > 0) {
                actionButtonHTML = `
                    <div class="download-box">
                        <p style="margin: 0 0 12px 0; font-size: 0.88rem; color: #f1c40f; font-weight: 600;">
                            <i class="fa-solid fa-triangle-exclamation"></i> Multi-part Archive (${gameParts.length} Parts). Download all parts for successful installation.
                        </p>
                        <button onclick='showDownloadPartsModal(${JSON.stringify(game)})' class="download-btn-main">
                            <i class="fa-solid fa-cloud-arrow-down"></i> Download All Parts (${gameSize})
                        </button>
                    </div>
                `;
            } else if (game.downloadUrl) {
                actionButtonHTML = `
                    <div class="download-box">
                        <a href="${game.downloadUrl}" target="_blank" class="download-btn-main">
                            <i class="fa-solid fa-cloud-arrow-down"></i> Direct Download (${gameSize})
                        </a>
                    </div>
                `;
            } else {
                actionButtonHTML = `
                    <div class="download-box" style="background: rgba(255,193,7,0.1); border-color: rgba(255,193,7,0.3);">
                        <p style="margin: 0; color: #ffc107; font-weight: 600;"><i class="fa-solid fa-circle-info"></i> Download links updating soon. Check back shortly!</p>
                    </div>
                `;
            }

            // Screenshots HTML
            let screenshotsHTML = '';
            if (screenshots.length > 0) {
                screenshotsHTML = `
                    <div class="screenshots-section">
                        <h3><i class="fa-solid fa-images" style="color: var(--accent-blue);"></i> In-Game Screenshots</h3>
                        <div class="screenshots-grid">
                            ${screenshots.map(shot => `
                                <div class="screenshot-item" onclick="openLightbox('${shot}')">
                                    <img src="${shot}" alt="Screenshot" loading="lazy" onerror="this.src='images/nfsmw-shot1.png';">
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="game-hero-card">
                    <div class="hero-grid">
                        <!-- Left: Cover & Quick Specs -->
                        <div>
                            <div class="cover-wrapper">
                                <img src="${image}" alt="${title}" onclick="openLightbox('${image}')" onerror="this.src='images/nfsmw-shot1.png';">
                            </div>
                            <div class="specs-box">
                                <div class="spec-row">
                                    <span class="spec-label">Platform</span>
                                    <span class="spec-value">${platform}</span>
                                </div>
                                <div class="spec-row">
                                    <span class="spec-label">File Size</span>
                                    <span class="spec-value">${gameSize}</span>
                                </div>
                                <div class="spec-row">
                                    <span class="spec-label">Category</span>
                                    <span class="spec-value">${category}</span>
                                </div>
                                <div class="spec-row">
                                    <span class="spec-label">Price</span>
                                    <span class="spec-value" style="color: var(--accent-green);">${displayPrice}</span>
                                </div>
                            </div>
                        </div>

                        <!-- Right: Details, Sys Req & Download -->
                        <div class="game-info-content">
                            <div class="badge-group">
                                <span class="badge">${category}</span>
                                <span class="badge">${platform}</span>
                                <span class="badge badge-price">${displayPrice}</span>
                            </div>
                            <h1>${title}</h1>
                            <p class="game-description">${description}</p>

                            <div class="sys-req-container">
                                <h3><i class="fa-solid fa-laptop-code"></i> System Requirements</h3>
                                ${sysReqHTML}
                            </div>

                            ${actionButtonHTML}
                        </div>
                    </div>
                </div>

                ${screenshotsHTML
