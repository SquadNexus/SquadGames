<div class="container">
    <!-- Header & Search -->
    <div class="portal-header-wrapper">
        <div class="portal-logo-area">
            <h1 class="portal-logo">Squad Games Store TZ</h1>
            <div class="portal-search-wrapper">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="gameSearchInput" placeholder="Search games, mods, simulator...">
            </div>
        </div>
        <div id="dynamic-game-types" class="portal-navbar"></div>
    </div>

    <!-- ApunKaGames Style Two-Column Portal Grid -->
    <div class="portal-layout-grid">
        
        <!-- LEFT COLUMN: Featured Hero Slider & Latest Games -->
        <div class="portal-main-content">
            
            <!-- 1. Featured Games Hero Slider with Arrows & Title Below -->
            <div class="apunka-featured-box">
                <h3 class="section-title"><span style="margin-right: 6px;">🎮</span> Featured Games</h3>
                <div class="hero-slider-wrapper">
                    <button class="slider-arrow slider-prev" onclick="moveFeaturedSlide(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                    <div id="heroSliderImageContainer" class="hero-slider-img-container" onclick="openFeaturedDetails()">
                        <img id="heroSliderImg" src="" alt="Featured Game" class="hero-slider-img">
                    </div>
                    <button class="slider-arrow slider-next" onclick="moveFeaturedSlide(1)"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
                <h2 id="heroSliderTitle" class="hero-slider-title">Loading Featured Game...</h2>
            </div>

            <!-- 2. Latest Games Added Section (Horizontal Grid Cards with Dates & Badges) -->
            <div class="apunka-section-box">
                <h3 class="section-title"><span style="margin-right: 6px;">🔥</span> Latest Games Added</h3>
                <div id="latestGamesGrid" class="latest-games-grid">
                    <!-- Populated dynamically -->
                </div>
            </div>

            <!-- 3. Main Game Catalog Grid -->
            <div class="apunka-section-box" style="margin-top: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <h3 class="section-title" style="margin: 0;"><span style="margin-right: 6px;">🛒</span> Game Catalog & Store</h3>
                </div>
                <div id="games-grid" class="game-grid">
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <p>Loading catalog...</p>
                    </div>
                </div>
            </div>

        </div>

        <!-- RIGHT COLUMN: Popular Posts Sidebar -->
        <div class="portal-sidebar">
            <div class="sidebar-box">
                <h3 class="sidebar-title">Popular Posts</h3>
                <div id="popularPostsTextList" class="popular-posts-text-list">
                    <!-- Text links list matching reference image -->
                </div>
            </div>
        </div>

    </div>
</div>
